    <script>
        $(document).ready(function(){
            $("#dodaj").click(function(){
                let nextNumber = $("#list li").length + 1
                $("#list").append(`<li>${nextNumber}</li>`)
            })
            $("#usun").click(function(){
                $("#list li:last").remove()
                $("#list li").each(function(index){
                    $(this).text(index + 1)
                })
            })
        })
    </script>
