<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <form action="">
        <input type="text" name="" id=""> <br>
        wartosc 1: <input type="radio" name="radio" value="wartosc 1" id=""> <br>
        wartosc 2: <input type="radio" name="radio" value="wartosc 2" id=""> <br>
        wartosc 3: <input type="radio" name="radio" value="wartosc 3" id=""> <br>
        <select name="" id="">
            <option value="wartosc 1">wartosc 1</option>
            <option value="wartosc 2">wartosc 2</option>
            <option value="wartosc 3">wartosc 3</option>
        </select> <br>
        wartosc 1: <input type="checkbox" name="radio" value="wartosc 1" id=""> <br>
        wartosc 2: <input type="checkbox" name="radio" value="wartosc 2" id=""> <br>
        wartosc 3: <input type="checkbox" name="radio" value="wartosc 3" id=""> <br>
        <hr>
        <p id="textPar">Text: </p>
        <p id="radioPar">Radio: </p>
        <p id="selectPar">Select: </p>
        <p id="checkboxPar">Checkbox: </p>
    </form>

    <script src="jquery-1.11.3.js"></script>
    <script>
        $(document).ready(function(){
            $(":text").keyup(function(){
                let wartosc = $(this).val()
                $("#textPar").text("Text: " + wartosc)
            })
            $(":radio").click(function(){
                let wartosc = $(this).val()
                $("#radioPar").text("Radio: " + wartosc)
            })
            $("select").click(function(){
                let wartosc = $(this).val()
                $("#selectPar").text("Select: " + wartosc)
            })
            $("[type=checkbox]").click(function(){
                let wartosc = []

                $("[type=checkbox]:checked").each(function(){
                    wartosc.push($(this).val())
                })

                $("#checkboxPar").text("Checkbox: " + wartosc)
            })
        })
    </script>
    
</body>
